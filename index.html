<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetAdopt - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top custom-navbar">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">
                PetAdopt
                <img src="assets/img/logo.png" class="logo">
            </a>
            <button class="navbar-toggler custom-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto ms-lg-4">
                    <li class="nav-item"><a class="nav-link active" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="caini.html">Câini</a></li>
                    <li class="nav-item"><a class="nav-link" href="pisici.html">Pisici</a></li>
                    <li class="nav-item"><a class="nav-link" href="favorite.html">Favorite</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
                </ul>

                <form class="d-flex" role="search">
                    <input id="searchInput" class="form-control search-input me-2" type="search" placeholder="Caută un animal..." aria-label="Search">
                    <button id="searchButton" class="btn search-btn" type="button">Caută</button>
                </form>
            </div>
        </div>
    </nav>

    <main class="container main-content">
        
        <section class="hero-section text-center">
            <div class="hero-card mx-auto">
                <h1 class="display-5 fw-bold">Bun venit la PetAdopt!</h1>
                <p class="lead mt-3">
                    Găsește-ți viitorul prieten blănos printre micuții de mai jos.
                </p>

                <div class="mt-4">
                    <a href="pisici.html" class="btn hero-btn-primary btn-lg mx-2">Vezi Pisici</a>
                    <a href="caini.html" class="btn hero-btn-secondary btn-lg mx-2">Vezi Câini</a>
                </div>
            </div>
        </section>

        <section class="story-section mt-5">
            <div class="row justify-content-center g-4">
        
                <div class="col-md-10 col-lg-8">
                    <div class="content-card p-4">
                        <h3 class="text-center mb-3 section-title">Povestea noastră</h3>
                        <div class="ratio ratio-16x9 shadow rounded overflow-hidden" style="background: #000;">
                            <video controls style="object-fit: contain; width: 100%; height: 100%;">
                                <source src="assets/video/cat-vid-1.mp4" type="video/mp4">
                                Browser-ul tău nu suportă tag-ul video.
                            </video>
                        </div>
                    </div>
                </div>

                <div class="col-md-10 col-lg-8">
                    <div class="content-card p-4">
                        <h3 class="text-center mb-3 section-title">Un nou început</h3>
                        <div class="ratio ratio-16x9 shadow rounded overflow-hidden" style="background: #000;">
                            <video controls style="object-fit: contain; width: 100%; height: 100%;">
                                <source src="assets/video/dog-vid-2.mp4" type="video/mp4">
                                Browserul tău nu suportă formatul video.
                            </video>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <footer class="site-footer text-center py-4 mt-5">
        <div class="container">
            <p class="mb-0">© 2026 PetAdopt — Oferim o nouă șansă prietenilor fără casă.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
